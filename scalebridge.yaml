name: scalebridge-dev
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults

dependencies:
  - python=3.10
  - pip

  # Core scientific stack
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - statsmodels
  - tqdm
  - pyyaml
  - python-dotenv

  # PyTorch stack
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  # Optimization / control
  - pyomo
  - casadi
  - cvxpy

  # Data / storage
  - sqlalchemy
  - psycopg2
  - alembic

  # Visualization / apps
  - plotly
  - dash

  # Testing / formatting
  - pytest
  - black
  - ruff
  - mypy
  - ipykernel
  - jupyterlab

  - pip:
      # Experiment tracking
      - mlflow

      # Tuning
      - optuna
      - ray[tune]

      # RL / Gymnasium
      - gymnasium
      - stable-baselines3

      # Scientific ML / control
      - neuromancer

      # EnergyPlus / building simulation helpers
      - eppy
      - opyplus

      # OpenDSS helpers
      - opendssdirect.py
      - dss-python

      # Utilities
      - rich
      - typer
